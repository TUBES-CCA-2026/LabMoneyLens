; =========================================================
; LabMoneyLens - PHP local.ini
; =========================================================

; Laravel butuh ini kalau ada upload receipt/foto profil ukuran besar
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; Timezone Indonesia (sesuaikan jika perlu)
date.timezone = Asia/Makassar

; -------------------------------------------------
; OPcache: aktif untuk performa, tapi validate_timestamps=1
; supaya perubahan file lewat bind mount tetap langsung
; kebaca tanpa perlu restart container (nyaman untuk dev),
; namun tetap dapat manfaat cache untuk production-like use.
; -------------------------------------------------
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

; Matikan expose_php untuk sedikit lebih aman
expose_php = Off
