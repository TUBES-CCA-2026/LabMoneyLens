# =========================================================
# LabMoneyLens - Nginx server block
# Front controller Laravel ada di public/index.php
# =========================================================

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Samakan dengan post_max_size di local.ini agar upload besar
    # tidak ditolak Nginx sebelum sampai ke PHP.
    client_max_body_size 25M;

    charset utf-8;

    access_log /var/log/nginx/labmoneylens.access.log;
    error_log  /var/log/nginx/labmoneylens.error.log warn;

    # Asset hasil build Vite (public/build) - cache lebih lama
    # karena nama filenya sudah mengandung hash (cache busting).
    location /build/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Blokir akses langsung ke file dotfile (.env, .git, dsb)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
        fastcgi_hide_header X-Powered-By;
    }

    # Cegah eksekusi PHP dari dalam folder storage/vendor (defense in depth)
    location ~* ^/(storage|vendor)/.*\.php$ {
        deny all;
    }
}
